name: CI

# Runs on every push and pull request: content validation, tests, and a production build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate topic & essentials content
        run: npm run validate

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
